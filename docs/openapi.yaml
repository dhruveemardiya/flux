openapi: 3.0.3
info:
  title: Flux CRM REST API
  description: |
    Complete REST API specification for Flux Custom CRM module inside the enterprise Impression application.
    Supports React Web frontend and Flutter Mobile application.
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8000/api
    description: Local Web Development Server
  - url: http://10.0.2.2:8000/api
    description: Android Emulator Host Gateway
  - url: https://api.yourdomain.com/api
    description: Production API Server

paths:
  /login/:
    post:
      summary: Authenticate user & generate DRF auth token
      tags: [Authentication]
      security:
        - BasicAuth: []
      requestBody:
        description: Empty JSON body or credentials
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: 9944b09199c62bcf9418ad846dd0e4bbdfc6ee4b
                  role:
                    type: string
                    example: Sales Executive
        '401':
          description: Invalid username or password
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Incorrect password

  /logout/:
    post:
      summary: Revoke current session token
      tags: [Authentication]
      security:
        - TokenAuth: []
      responses:
        '200':
          description: Session invalidated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out successfully

  /users/me/:
    get:
      summary: Retrieve current authenticated user profile
      tags: [Authentication]
      security:
        - TokenAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'

  /users/change-password/:
    post:
      summary: Change authenticated user password
      tags: [Authentication]
      security:
        - TokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password:
                  type: string
                new_password:
                  type: string
      responses:
        '200':
          description: Password updated

  /notifications/device-token/:
    post:
      summary: Register mobile push notification token (FCM / APNS)
      tags: [Notifications]
      security:
        - TokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                platform:
                  type: string
                  enum: [android, ios]
      responses:
        '200':
          description: Token registered
    delete:
      summary: Unregister mobile push token
      tags: [Notifications]
      security:
        - TokenAuth: []
      responses:
        '200':
          description: Token removed

  /crm/dashboard/summary/:
    get:
      summary: Fetch real-time KPI metrics and dashboard feeds
      tags: [Dashboard]
      security:
        - TokenAuth: []
      responses:
        '200':
          description: Dashboard summary data
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_admin:
                    type: boolean
                  kpis:
                    type: object
                  recent_activities:
                    type: array
                    items:
                      type: object
                  segment_distribution:
                    type: array
                    items:
                      type: object

  /crm/users/:
    get:
      summary: List authorized staff members
      tags: [Users]
      security:
        - TokenAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [Active, Inactive]
      responses:
        '200':
          description: Staff listing
    post:
      summary: Create new staff member
      tags: [Users]
      security:
        - TokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaffPayload'
      responses:
        '201':
          description: Staff created

  /crm/users/{user_id}/:
    get:
      summary: Get staff member detail
      tags: [Users]
      security:
        - TokenAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Staff details
    put:
      summary: Update staff member
      tags: [Users]
      security:
        - TokenAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStaffPayload'
      responses:
        '200':
          description: Staff updated
    delete:
      summary: Deactivate staff member
      tags: [Users]
      security:
        - TokenAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Staff deactivated

  /crm/roles/:
    get:
      summary: List CRM roles
      tags: [Roles & Permissions]
      security:
        - TokenAuth: []
      responses:
        '200':
          description: Roles list
    post:
      summary: Create CRM role
      tags: [Roles & Permissions]
      security:
        - TokenAuth: []
      responses:
        '201':
          description: Role created

  /crm/segments/:
    get:
      summary: List all segments with lead counts
      tags: [Segments]
      security:
        - TokenAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Segments listing
    post:
      summary: Create segment
      tags: [Segments]
      security:
        - TokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
                is_active:
                  type: boolean
      responses:
        '201':
          description: Segment created

  /crm/segments/{segment_id}/:
    get:
      summary: Get segment detail
      tags: [Segments]
      security:
        - TokenAuth: []
      parameters:
        - name: segment_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Segment detail
    put:
      summary: Update segment
      tags: [Segments]
      security:
        - TokenAuth: []
      parameters:
        - name: segment_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                is_active:
                  type: boolean
      responses:
        '200':
          description: Segment updated

  /crm/segments/{segment_id}/safe-delete/:
    post:
      summary: Safely deactivate segment and migrate leads
      tags: [Segments]
      security:
        - TokenAuth: []
      parameters:
        - name: segment_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [MOVED, UNASSIGNED]
                target_segment_id:
                  type: integer
      responses:
        '200':
          description: Leads migrated and segment safely deactivated

  /crm/leads/:
    get:
      summary: List leads with pagination, filters and search
      tags: [Leads]
      security:
        - TokenAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
        - name: segment
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: assigned_to
          in: query
          schema:
            type: integer
        - name: unassigned_only
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Paginated leads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLeadsResponse'
    post:
      summary: Create new lead
      tags: [Leads]
      security:
        - TokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadPayload'
      responses:
        '201':
          description: Lead created

  /crm/leads/{lead_id}/:
    get:
      summary: Get lead details
      tags: [Leads]
      security:
        - TokenAuth: []
      parameters:
        - name: lead_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lead detail
        '403':
          description: Unauthorized to view lead
    put:
      summary: Update lead
      tags: [Leads]
      security:
        - TokenAuth: []
      parameters:
        - name: lead_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadPayload'
      responses:
        '200':
          description: Lead updated
    delete:
      summary: Delete lead
      tags: [Leads]
      security:
        - TokenAuth: []
      parameters:
        - name: lead_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lead deleted

  /crm/leads/search/:
    get:
      summary: Search leads
      tags: [Leads]
      security:
        - TokenAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Search results

  /crm/leads/import/upload/:
    post:
      summary: Upload Excel/CSV spreadsheet to extract headers and preview rows
      tags: [Lead Import]
      security:
        - TokenAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Headers and preview rows extracted

  /crm/leads/import/validate/:
    post:
      summary: Validate mapping and perform duplicate detection against DB
      tags: [Lead Import]
      security:
        - TokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows, column_mapping]
              properties:
                rows:
                  type: array
                  items:
                    type: object
                column_mapping:
                  type: object
      responses:
        '200':
          description: Duplicate detection results and import token

  /crm/leads/import/commit/:
    post:
      summary: Commit import batch with row-by-row resolutions
      tags: [Lead Import]
      security:
        - TokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [import_token, rows, resolutions]
              properties:
                import_token:
                  type: string
                rows:
                  type: array
                  items:
                    type: object
                column_mapping:
                  type: object
                resolutions:
                  type: object
                create_unknown_segments:
                  type: boolean
                file_name:
                  type: string
      responses:
        '200':
          description: Import summary report

  /crm/assignments/:
    get:
      summary: List lead assignments
      tags: [Assignments]
      security:
        - TokenAuth: []
      responses:
        '200':
          description: Assignments list

  /crm/assignments/assign/:
    post:
      summary: Assign multiple leads to multiple staff members
      tags: [Assignments]
      security:
        - TokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lead_ids, user_ids]
              properties:
                lead_ids:
                  type: array
                  items:
                    type: integer
                user_ids:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: Assigned successfully

  /crm/assignments/reassign/:
    post:
      summary: Reassign leads from one staff to another with audit history
      tags: [Assignments]
      security:
        - TokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lead_ids, to_user_id]
              properties:
                lead_ids:
                  type: array
                  items:
                    type: integer
                from_user_id:
                  type: integer
                to_user_id:
                  type: integer
      responses:
        '200':
          description: Reassigned successfully

  /crm/assignments/unassign/:
    post:
      summary: Unassign lead from staff member
      tags: [Assignments]
      security:
        - TokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lead_ids, user_id]
              properties:
                lead_ids:
                  type: array
                  items:
                    type: integer
                user_id:
                  type: integer
      responses:
        '200':
          description: Unassigned successfully

  /crm/task-groups/:
    get:
      summary: List task groups (excludes Archived by default)
      tags: [Task Management]
      security:
        - TokenAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [Active, Scheduled, Completed, Cancelled]
        - name: priority
          in: query
          schema:
            type: string
            enum: [Low, Normal, High, Urgent]
      responses:
        '200':
          description: Task groups list
    post:
      summary: Create task group and auto-generate independent activities
      tags: [Task Management]
      security:
        - TokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskGroupPayload'
      responses:
        '201':
          description: Task group created

  /crm/task-groups/{task_group_id}/:
    get:
      summary: Get task group details with assignees and leads
      tags: [Task Management]
      security:
        - TokenAuth: []
      parameters:
        - name: task_group_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Task group detail
    put:
      summary: Edit task group with safe activity preservation
      tags: [Task Management]
      security:
        - TokenAuth: []
      parameters:
        - name: task_group_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskGroupPayload'
      responses:
        '200':
          description: Task group updated
    delete:
      summary: Soft-delete task group (sets status to Archived, preserves activities)
      tags: [Task Management]
      security:
        - TokenAuth: []
      parameters:
        - name: task_group_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Task group archived

  /crm/my-work/:
    get:
      summary: Get staff member's daily assigned work and activities
      tags: [My Work]
      security:
        - TokenAuth: []
      parameters:
        - name: date
          in: query
          description: today, yesterday, tomorrow, or YYYY-MM-DD
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Daily work activities and summary counts

  /crm/my-work/activities/{activity_id}/update/:
    post:
      summary: Update status, notes, action taken and next follow-up for activity
      tags: [My Work]
      security:
        - TokenAuth: []
      parameters:
        - name: activity_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [Pending, Completed, Rejected, No Answer, Callback Required, Not Interested, Follow-up Required]
                action_taken:
                  type: string
                notes:
                  type: string
                next_followup_date:
                  type: string
                  format: date
                next_followup_time:
                  type: string
      responses:
        '200':
          description: Activity updated and timeline entry added

  /crm/my-work/follow-ups/:
    get:
      summary: List scheduled follow-ups
      tags: [My Work]
      security:
        - TokenAuth: []
      responses:
        '200':
          description: Upcoming follow-ups

  /crm/reports/performance/:
    get:
      summary: Get performance report metrics
      tags: [Reports]
      security:
        - TokenAuth: []
      responses:
        '200':
          description: Performance reports metrics

  /crm/reports/staff/:
    get:
      summary: Get staff activity completion breakdown
      tags: [Reports]
      security:
        - TokenAuth: []
      responses:
        '200':
          description: Staff performance metrics

  /crm/reports/task-groups/:
    get:
      summary: Get task groups completion percentages
      tags: [Reports]
      security:
        - TokenAuth: []
      responses:
        '200':
          description: Task group progress metrics

  /crm/reports/segments/:
    get:
      summary: Get segment lead distribution
      tags: [Reports]
      security:
        - TokenAuth: []
      responses:
        '200':
          description: Segment lead counts

  /crm/quick-search/:
    get:
      summary: Persistent debounced lead search across company, contact, phone, email
      tags: [Quick Search]
      security:
        - TokenAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Matching lead snippets

  /crm/leads/{lead_id}/timeline/:
    get:
      summary: Retrieve 360-degree chronological communication history
      tags: [Communication Timeline]
      security:
        - TokenAuth: []
      parameters:
        - name: lead_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Chronological timeline of calls, meetings, emails and notes
    post:
      summary: Add communication log entry
      tags: [Communication Timeline]
      security:
        - TokenAuth: []
      parameters:
        - name: lead_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, notes]
              properties:
                channel:
                  type: string
                  enum: [Call, Meeting, Email, WhatsApp, Note, Status Update]
                notes:
                  type: string
                next_followup_date:
                  type: string
                  format: date
                next_followup_time:
                  type: string
      responses:
        '201':
          description: Communication logged

components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
    TokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: DRF Token format e.g. "Token 9944b09199c62bcf9418ad846dd0e4bbdfc6ee4b"

  schemas:
    UserProfile:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
        created_at:
          type: string
          format: date-time

    CreateStaffPayload:
      type: object
      required: [username, password, first_name, role]
      properties:
        username:
          type: string
        password:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
        mobile:
          type: string
        reporting_manager_id:
          type: integer
        account_status:
          type: string
          enum: [Active, Inactive]

    UpdateStaffPayload:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
        mobile:
          type: string
        reporting_manager_id:
          type: integer
        account_status:
          type: string
          enum: [Active, Inactive]
        password:
          type: string

    LeadPayload:
      type: object
      required: [company_name]
      properties:
        company_name:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        designation:
          type: string
        mobile:
          type: string
        secondary_mobile:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        secondary_email:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        pincode:
          type: string
        address_line1:
          type: string
        website:
          type: string
        segment:
          type: string
        lead_source:
          type: string
        status:
          type: string
        notes:
          type: string

    TaskGroupPayload:
      type: object
      required: [title, staff_ids]
      properties:
        title:
          type: string
        description:
          type: string
        priority:
          type: string
          enum: [Low, Normal, High, Urgent]
        status:
          type: string
          enum: [Active, Scheduled, Completed, Cancelled]
        start_date:
          type: string
          format: date
        start_time:
          type: string
        end_date:
          type: string
          format: date
        end_time:
          type: string
        staff_ids:
          type: array
          items:
            type: integer
        lead_ids:
          type: array
          items:
            type: integer

    PaginatedLeadsResponse:
      type: object
      properties:
        leads:
          type: array
          items:
            $ref: '#/components/schemas/LeadPayload'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        total_pages:
          type: integer
